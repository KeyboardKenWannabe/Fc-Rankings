name: Actualizar rankings
on:
  schedule:
    - cron: '17 9 * * *'     # una vez al día (09:17 UTC)
  workflow_dispatch: {}      # botón "Run workflow" para probar a mano
permissions:
  contents: write
concurrency:
  group: rankings
  cancel-in-progress: false  # nunca dos ejecuciones a la vez
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scrape.mjs
      - name: Commit
        run: |
          git config user.name "ranking-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "rankings $(date -u +%F)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          echo "No se pudo subir"; exit 1
