name: Scrape Fightcade Rankings

on:
  schedule:
    - cron: '35 3 * * *' # Todos los días a las 03:35 UTC
  workflow_dispatch:      # Para correrlo manualmente desde GitHub

permissions:
  contents: write         # Necesario para que el bot pueda hacer push

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run scraper
        run: node scrape.mjs

      - name: Commit and push changes if any
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update daily rankings"
            git push
          fi
