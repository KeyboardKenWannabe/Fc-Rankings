name: Scrape Fightcade Rankings

on:
  schedule:
    - cron: '35 3 * * *' # Ejecuta todos los días a las 03:35 UTC
  workflow_dispatch:      # Te permite correrlo manualmente cuando quieras desde la web de GitHub

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run scraper
        run: node scrape.mjs

      - name: Commit and push changes if any
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update daily rankings snapshot" && git push)
